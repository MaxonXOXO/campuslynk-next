          type: object
          properties:
            timestamp:
              type: string
              format: date-time
            tenant:
              type: object
              properties:
                slug:
                  type: string
                name:
                  type: string
        links:
          type: object
          properties:
            self:
              type: string

    PaginationMeta:
      type: object
      required: [current_page, last_page, per_page, total]
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer

    UserAssignmentSummary:
      type: object
      required: [id, role_key, role_name, scope_type, scope_label]
      properties:
        id:
          type: string
        role_key:
          type: string
        role_name:
          type: string
        scope_type:
          type: string
        scope_label:
          type: string

    CurrentUserAssignment:
      type: object
      required: [id, role_key, role_name, scope_type, scope_label, is_singleton]
      properties:
        id:
          type: string
        role_key:
          type: string
        role_name:
          type: string
        scope_type:
          type: string
        scope_label:
          type: string
        is_singleton:
          type: boolean
        valid_from:
          type: string
          format: date-time
          nullable: true
        valid_to:
          type: string
          format: date-time
          nullable: true

    ReasonRequiredInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
          example: No longer employed at institution

    UserAbilities:
      type: object
      required: [update, suspend, reactivate, deactivate, reset_password, unlock, approve, reject]
      properties:
        update:
          type: boolean
        suspend:
          type: boolean
        reactivate:
          type: boolean
        deactivate:
          type: boolean
        reset_password:
          type: boolean
        unlock:
          type: boolean
        approve:
          type: boolean
        reject:
          type: boolean

    StaffProfileSchema:
      type: object
      properties:
        requested_department_id:
          type: string
          nullable: true
        designation:
          type: string
          nullable: true
        employee_id:
          type: string
          nullable: true
        import_batch_id:
          type: string
          nullable: true

    RegisterStaffInput:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          nullable: true
        mobile:
          type: string
          nullable: true
        password:
          type: string
          minLength: 8
        requested_department_id:
          type: string
          nullable: true
        designation:
          type: string
          nullable: true
        employee_id:
          type: string
          nullable: true
        website:
          type: string
          nullable: true

    BulkApproveUsersInput:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string

    BulkApproveEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [results, summary]
          properties:
            results:
              type: array
              items:
                type: object
                required: [user_id, status]
                properties:
                  user_id:
                    type: string
                  status:
                    type: string
                    enum: [approved, skipped, forbidden, not_found]
                  message:
                    type: string
                    nullable: true
            summary:
              type: object
              required: [approved, failed]
              properties:
                approved:
                  type: integer
                failed:
                  type: integer
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true

    CommitStaffImportInput:
      type: object
      required: [common_password]
      properties:
        common_password:
          type: string
          minLength: 8
        auto_approve:
          type: boolean
        idempotency_key:
          type: string
          nullable: true

    StaffImportBatchSchema:
      type: object
      required: [id, filename, status, auto_approve, total_rows, valid_rows, duplicate_rows, invalid_rows, created_count, skipped_duplicate_count, failed_count]
      properties:
        id:
          type: string
        filename:
          type: string
        status:
          type: string
          enum: [previewed, queued, processing, completed, failed]
        auto_approve:
          type: boolean
        total_rows:
          type: integer
        valid_rows:
          type: integer
        duplicate_rows:
          type: integer
        invalid_rows:
          type: integer
        created_count:
          type: integer
        skipped_duplicate_count:
          type: integer
        failed_count:
          type: integer
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true

    StaffImportBatchEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          $ref: '#/components/schemas/StaffImportBatchSchema'
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true

    StaffImportPreviewEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [batch, rows_preview]
          properties:
            batch:
              $ref: '#/components/schemas/StaffImportBatchSchema'
            rows_preview:
              type: array
              items:
                type: object
                required: [row_number, status, payload, errors]
                properties:
                  row_number:
                    type: integer
                  status:
                    type: string
                    enum: [valid, duplicate, invalid]
                  payload:
                    type: object
                    additionalProperties: true
                  errors:
                    type: array
                    items:
                      type: string
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true

    UserSchema:
      type: object
      required: [id, type, name, status, must_change_password, is_locked, assignments, abilities]
      properties:
        id:
          type: string
          description: ULID identifier
          example: 01HZX876543210ABCDEFGHJKMN
        type:
          type: string
          enum: [staff, student, parent]
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          nullable: true
          example: john.doe@carmelpoly.in
        mobile:
          type: string
          nullable: true
          example: "+919876543210"
        registration_number:
          type: string
          nullable: true
          example: REG-2026-001
        status:
          type: string
          enum: [active, suspended, pending, deactivated, rejected]
        status_reason:
          type: string
          nullable: true
        deactivated_at:
