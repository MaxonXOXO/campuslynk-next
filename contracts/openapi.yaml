openapi: 3.1.0
info:
  title: CampusLynk Academic Suite API
  version: 1.0.0
  description: >
    Multi-tenant SaaS & On-Premises Academic Management API (ADR-0001 through ADR-0012).
    All responses use the standard `{ data, meta, links }` envelope or `application/problem+json` (RFC 7807).
servers:
  - url: https://app.carmelpoly.in/api/v1
    description: Carmel Polytechnic On-Premises Instance
  - url: http://app.carmelpoly.localhost:8000/api/v1
    description: Local Development
paths:
  /health:
    get:
      operationId: getHealthStatus
      summary: Health check probe
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok

  /meta:
    get:
      operationId: getTenantMeta
      summary: Resolve tenant branding, active regulations (REV2021/REV2026), and auth providers
      parameters:
        - name: X-Tenant
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Tenant metadata resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMetaEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '404':
          $ref: '#/components/responses/ProblemDetails'

  /auth/login:
    post:
      operationId: login
      summary: Authenticate tenant user by email, mobile, or registration number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password, device_name, client]
              properties:
                identifier:
                  type: string
                  description: Email address, E.164 mobile number, or registration number
                  example: admin@app.carmelpoly.in
                password:
                  type: string
                  format: password
                  maxLength: 128
                  example: StrongPassword123!
                device_name:
                  type: string
                  example: Chrome Web
                client:
                  type: string
                  enum: [web, mobile]
                  example: web
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'
        '429':
          $ref: '#/components/responses/ProblemDetails'

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current personal access token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'

  /auth/password/change:
    post:
      operationId: changePassword
      summary: Change user password and revoke all other sessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, new_password_confirmation]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
                new_password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'

  /me:
    get:
      operationId: getCurrentUser
      summary: Current user profile, active scoped role assignments, capabilities, and tenant meta
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '403':
          description: >-
            Forbidden error (`password-change-required`). Returned when the user has `must_change_password = true` and must change their password before accessing protected endpoints.
          content:
            application/problem+json:
              schema:
                type: object
                required: [type, title, status, detail]
                properties:
                  type:
                    type: string
                    description: URI reference identifying the problem type
                    example: https://errors.campuslynk.net/password-change-required
                  title:
                    type: string
                    example: Password Change Required
                  status:
                    type: integer
                    example: 403
                  detail:
                    type: string
                    example: You must change your password before accessing other features.
                  instance:
                    type: string
                    nullable: true
              examples:
                passwordChangeRequired:
                  summary: Password change required
                  description: Returned when the authenticated user must change their temporary password before accessing protected features.
                  value:
                    type: https://errors.campuslynk.net/password-change-required
                    title: Password Change Required
                    status: 403
                    detail: You must change your password before accessing other features.

  /auth/register-staff:
    post:
      operationId: registerStaff
      summary: Public staff self-registration (rate-limited, behind tenant setting, always returns 202 to prevent enumeration)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterStaffInput'
      responses:
        '202':
          description: Registration accepted for review
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'
        '429':
          $ref: '#/components/responses/ProblemDetails'

  /auth/capabilities:
    get:
      operationId: getAuthCapabilities
      summary: Public tenant-resolved authentication capabilities (rate-limited, private cache, Vary X-Tenant)
      responses:
        '200':
          description: Public authentication capabilities
          headers:
            Cache-Control:
              schema:
                type: string
                example: private, max-age=60
            Vary:
              schema:
                type: string
                example: X-Tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCapabilitiesEnvelope'
        '429':
          $ref: '#/components/responses/ProblemDetails'

  /settings:
    get:
      operationId: listTenantSettings
      summary: List whitelisted auth.* tenant settings and Sanctum token summary (Super Admin at institution scope)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Whitelisted tenant settings and token summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingsEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /settings/{key}:
    put:
      operationId: updateTenantSetting
      summary: Update a whitelisted auth.* tenant setting (reason required when enabling staff self-registration)
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum:
              - auth.staff_self_registration_enabled
              - auth.staff_self_registration_daily_cap
              - auth.rejected_resubmit_cooldown_days
              - auth.token_lifetime_web_hours
              - auth.token_lifetime_mobile_days
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantSettingInput'
      responses:
        '200':
          description: Updated tenant setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTenantSettingEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'

  /audit-logs:
    get:
      operationId: listAuditLogs
      summary: List role-scoped tenant audit logs (super_admin sees all logs; principal sees identity, organisation, and rbac)
      security:
        - bearerAuth: []
      parameters:
        - name: log_name
          in: query
          schema:
            type: string
            maxLength: 64
        - name: event
          in: query
          schema:
            type: string
            maxLength: 128
        - name: causer_id
          in: query
          schema:
            type: string
            minLength: 26
            maxLength: 26
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: search
          in: query
          schema:
            type: string
            maxLength: 120
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: Paginated audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogsEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'

  /impersonation:
    post:
      operationId: startImpersonation
      summary: Start an audited impersonation session (max 30 mins; read-only for academic roles)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_user_id, reason]
              properties:
                target_user_id:
                  type: string
                reason:
                  type: string
                  minLength: 10
      responses:
        '200':
          description: Impersonation token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationTokenEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /impersonation/stop:
    post:
      operationId: stopImpersonation
      summary: Stop an active impersonation session and revoke token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Impersonation session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'

  /users:
    get:
      operationId: listUsers
      summary: List users with pagination and filtering
      description: Returns users with current assignments inside the caller's authorized scopes. Institution-wide grants also include unassigned accounts.
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, suspended, pending, deactivated, rejected]
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [staff, student, parent]
        - name: role_key
          in: query
          required: false
          schema:
            type: string
        - name: department_id
          in: query
          required: false
          schema:
            type: string
        - name: requested_department_id
          in: query
          required: false
          schema:
            type: string
        - name: must_change_password
          in: query
          required: false
          schema:
            type: boolean
        - name: expired_temp_password
          in: query
          required: false
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Paginated users list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsersEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'
    post:
      operationId: createUser
      summary: Create a new user in the active tenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
      responses:
        '201':
          description: User created (returns one-time temporary_password and expires_at when password is omitted; Cache-Control no-store)
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'

  /users/{id}:
    get:
      operationId: getUser
      summary: Get user details and assigned roles
      description: Uses the same permission and scope predicates as the user directory.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '404':
          $ref: '#/components/responses/ProblemDetails'
        '403':
          $ref: '#/components/responses/ProblemDetails'
    put:
      operationId: updateUser
      summary: Update user attributes and status
      description: Requires user-update permission within the target user's managing scope.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /roles:
    get:
      operationId: listRoles
      summary: List assignable roles with singleton and stream metadata
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleListEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /streams:
    get:
      operationId: listStreams
      summary: List all streams with department counts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of streams
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, links]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Stream'
                  meta:
                    type: object
                    required: [total]
                    properties:
                      total:
                        type: integer
                  links:
                    type: object
                    required: [self]
                    properties:
                      self:
                        type: string
        '403':
          $ref: '#/components/responses/ProblemDetails'
    post:
      operationId: createStream
      summary: Create a new stream
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStreamRequest'
      responses:
        '201':
          description: Stream created
          content:
            application/json:
              schema:
                type: object
                required: [data, links]
                properties:
                  data:
                    $ref: '#/components/schemas/Stream'
                  links:
                    type: object
                    required: [self]
                    properties:
                      self:
                        type: string
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'

  /streams/{id}:
    patch:
      operationId: updateStream
      summary: Update a stream name
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStreamRequest'
      responses:
        '200':
          description: Stream updated
          content:
            application/json:
              schema:
                type: object
                required: [data, links]
                properties:
                  data:
                    $ref: '#/components/schemas/Stream'
                  links:
                    type: object
                    required: [self]
                    properties:
                      self:
                        type: string
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'
    delete:
      operationId: deleteStream
      summary: Delete a stream
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stream deleted
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                  meta:
                    type: object
                    required: [timestamp]
                    properties:
                      timestamp:
                        type: string
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '409':
          $ref: '#/components/responses/ProblemDetails'

  /departments:
    get:
      operationId: listDepartments
      summary: List institution departments with stream and academic/administrative kind
      description: Returns only departments inside the caller's authorized read scopes.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of departments
        '403':
          $ref: '#/components/responses/ProblemDetails'
    post:
      operationId: createDepartment
      summary: Create a new institution department
      description: Requires department-management permission over the parent stream.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code, stream, kind]
              properties:
                name:
                  type: string
                code:
                  type: string
                stream:
                  type: string
                  enum: [engineering, general_academics, administrative]
                kind:
                  type: string
                  enum: [academic, administrative]
                is_active:
                  type: boolean
      responses:
        '201':
          description: Department created
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'

  /departments/{id}:
    get:
      operationId: getDepartment
      summary: Get department details
      description: Uses the same permission and scope predicates as the department collection.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Department details
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '404':
          $ref: '#/components/responses/ProblemDetails'
    put:
      operationId: updateDepartment
      summary: Update department details
      description: Requires department-management permission within the target department's managing scope.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                code:
                  type: string
                stream:
                  type: string
                kind:
                  type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: Department updated
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'
    delete:
      operationId: deleteDepartment
      summary: Delete a department
      description: Requires department-management permission within the target department's managing scope.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Department deleted
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [message]
                    properties:
                      message:
                        type: string
                  meta:
                    type: object
                    required: [timestamp]
                    properties:
                      timestamp:
                        type: string
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '404':
          $ref: '#/components/responses/ProblemDetails'
        '409':
          $ref: '#/components/responses/ProblemDetails'

  /batches:
    get:
      operationId: listBatches
      summary: List batches visible to current user based on ltree scope hierarchy
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated batches
    post:
      operationId: createBatch
      summary: Create a new academic batch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchInput'
      responses:
        '201':
          description: Batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'

  /batches/{id}:
    get:
      operationId: getBatch
      summary: Get batch details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '404':
          $ref: '#/components/responses/ProblemDetails'
    put:
      operationId: updateBatch
      summary: Update batch details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                  enum: [active, graduated, archived]
      responses:
        '200':
          description: Batch updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'

  /batches/{id}/promote:
    post:
      operationId: promoteBatchSemester
      summary: Promote batch to next semester and transition managing department per ADR-0005
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch promoted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /users/{id}/unlock:
    post:
      operationId: unlockUserAccount
      summary: Administratively clear login lockouts across all rate limiting tiers (requires identity.user.unlock, restricted to Super Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User unlocked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '404':
          $ref: '#/components/responses/ProblemDetails'

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      summary: Administratively reset a user's password to a one-time server-generated temporary password (requires identity.user.reset_password; forbids self-reset and equal/higher authority targets)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Temporary password issued once (Cache-Control no-store)
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetPasswordEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '404':
          $ref: '#/components/responses/ProblemDetails'

  /users/{id}/suspend:
    post:
      operationId: suspendUserAccount
      summary: Suspend a user account and revoke all access tokens immediately
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  nullable: true
      responses:
        '200':
          description: User suspended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '403':
