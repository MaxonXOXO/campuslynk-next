          example: 01HMG7XYZ456ABCDEF01234567
        code:
          type: string
          example: AIDED
        name:
          type: string
          example: Aided Stream
        scope_label:
          type: string
          example: s_aided
        departments_count:
          type: integer
          example: 4
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    CreateStreamRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: AIDED
        name:
          type: string
          example: Aided Stream

    UpdateStreamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Aided Stream (Updated)
