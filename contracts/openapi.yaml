              type: string
            type:
              type: string
              enum: [staff, student, parent]
            name:
              type: string
            email:
              type: string
              nullable: true
            mobile:
              type: string
              nullable: true
            registration_number:
              type: string
              nullable: true
            status:
              type: string
              enum: [active, suspended, pending]
            must_change_password:
              type: boolean
            last_login_at:
