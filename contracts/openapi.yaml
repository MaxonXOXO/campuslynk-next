  /setup/status:
    get:
      operationId: getSetupStatus
      summary: Retrieve first-run setup wizard state and prerequisite counts
      description: >-
        Read-only reporting of persisted setup state. Each step is_completed requires
        both a nonempty completion timestamp and its tenant setting row. A missing
        setting returns settings_exist=false and values=null even if a historical
        step timestamp remains. This operation never initializes defaults; an absent
        signup_policy remains null until explicitly saved or initialized by a
        successful POST /setup/complete.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Setup status resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '403':
          description: >-
            Forbidden error. Returned with one of three RFC 7807 problem types:
            - `password-change-required`: User has `must_change_password = true` and must change their password first.
            - `forbidden`: User lacks the `super_admin` role or is not scoped to `institution`.
            - `impersonation-not-allowed`: Setup endpoints cannot be accessed during an active impersonation session.
          content:
            application/problem+json:
              schema:
                type: object
                required: [type, title, status, detail]
                properties:
                  type:
                    type: string
                    description: URI reference identifying the problem type
                    enum:
                      - https://errors.campuslynk.net/password-change-required
                      - https://errors.campuslynk.net/forbidden
                      - https://errors.campuslynk.net/impersonation-not-allowed
                  title:
                    type: string
                    example: Forbidden
                  status:
                    type: integer
                    example: 403
                  detail:
                    type: string
                  instance:
                    type: string
                    nullable: true
              examples:
                passwordChangeRequired:
                  summary: Password change required
                  description: Returned when the user must change their temporary password before accessing protected features.
                  value:
                    type: https://errors.campuslynk.net/password-change-required
                    title: Password Change Required
                    status: 403
                    detail: You must change your password before accessing other features.
                forbidden:
                  summary: Wrong role or non-institution scope
                  description: Returned when the user lacks the super_admin role at institution scope.
                  value:
                    type: https://errors.campuslynk.net/forbidden
                    title: Forbidden
                    status: 403
                    detail: Access requires super_admin role at institution scope.
                impersonationNotAllowed:
                  summary: Impersonation session active
                  description: Returned when accessing setup endpoints during an impersonation session.
                  value:
                    type: https://errors.campuslynk.net/impersonation-not-allowed
                    title: Forbidden
                    status: 403
                    detail: Setup endpoints cannot be accessed during an impersonation session.

  /setup/steps/{step}:
    put:
      operationId: saveSetupStep
      summary: Save or update configuration for a specific setup step and mark it complete
      description: >-
        Explicitly saves the supplied configuration, preserving existing step and
        overall completion timestamps. Saving signup_policy is optional before
        finalization; this operation remains available to choose custom preferences
        before or after setup completion.
      security:
        - bearerAuth: []
      parameters:
        - name: step
          in: path
          required: true
          schema:
            type: string
            enum: [institution_profile, calendar_basics, signup_policy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/InstitutionProfileValues'
                - $ref: '#/components/schemas/CalendarBasicsValues'
                - $ref: '#/components/schemas/SignupPolicyValues'
      responses:
        '200':
          description: Setup step saved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '403':
          description: >-
            Forbidden error. Returned with one of three RFC 7807 problem types:
            - `password-change-required`: User has `must_change_password = true` and must change their password first.
            - `forbidden`: User lacks the `super_admin` role or is not scoped to `institution`.
            - `impersonation-not-allowed`: Setup endpoints cannot be accessed during an active impersonation session.
          content:
            application/problem+json:
              schema:
                type: object
                required: [type, title, status, detail]
                properties:
                  type:
                    type: string
                    description: URI reference identifying the problem type
                    enum:
                      - https://errors.campuslynk.net/password-change-required
                      - https://errors.campuslynk.net/forbidden
                      - https://errors.campuslynk.net/impersonation-not-allowed
                  title:
                    type: string
                    example: Forbidden
                  status:
                    type: integer
                    example: 403
                  detail:
                    type: string
                  instance:
                    type: string
                    nullable: true
              examples:
                passwordChangeRequired:
                  summary: Password change required
                  description: Returned when the user must change their temporary password before accessing protected features.
                  value:
                    type: https://errors.campuslynk.net/password-change-required
                    title: Password Change Required
                    status: 403
                    detail: You must change your password before accessing other features.
                forbidden:
                  summary: Wrong role or non-institution scope
                  description: Returned when the user lacks the super_admin role at institution scope.
                  value:
                    type: https://errors.campuslynk.net/forbidden
                    title: Forbidden
                    status: 403
                    detail: Access requires super_admin role at institution scope.
                impersonationNotAllowed:
                  summary: Impersonation session active
                  description: Returned when accessing setup endpoints during an impersonation session.
                  value:
                    type: https://errors.campuslynk.net/impersonation-not-allowed
                    title: Forbidden
                    status: 403
                    detail: Setup endpoints cannot be accessed during an impersonation session.
        '404':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'

  /setup/complete:
    post:
      operationId: completeSetup
      summary: Finalize first-run setup with optional sign-up policy defaults
      description: >-
        Requires persisted institution_profile and calendar_basics settings with
        nonempty step completion timestamps, plus at least one stream, department,
        and academic year. An explicit signup_policy save is not required. Inside
        one tenant transaction, relevant setting and prerequisite rows are locked,
        all prerequisites are checked, and an absent policy is created with
        student_self_registration_enabled=false, parent_self_registration_enabled=false,
        and approval_mode=manual. Existing policy values and row timestamps are
        preserved; only a missing policy step completion timestamp is supplied.
        Default creation is attributed to the completing administrator in the tenant
        activity log as signup_policy.defaults_initialized with source=setup_completion,
        distinguishing it from an explicit save. Finalization and initialization are
        atomic: failed completion leaves no newly created policy or completion markers.
        Repeated or losing concurrent completion requests return 409 setup-already-completed.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >-
            Setup successfully finalized. The response includes persisted policy
            values (defaults if previously absent), its nonempty completion timestamp,
            settings_exist=true, and is_completed=true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '403':
          description: >-
            Forbidden error. Returned with one of three RFC 7807 problem types:
            - `password-change-required`: User has `must_change_password = true` and must change their password first.
            - `forbidden`: User lacks the `super_admin` role or is not scoped to `institution`.
            - `impersonation-not-allowed`: Setup endpoints cannot be accessed during an active impersonation session.
          content:
            application/problem+json:
              schema:
                type: object
                required: [type, title, status, detail]
                properties:
                  type:
                    type: string
                    description: URI reference identifying the problem type
                    enum:
                      - https://errors.campuslynk.net/password-change-required
                      - https://errors.campuslynk.net/forbidden
                      - https://errors.campuslynk.net/impersonation-not-allowed
                  title:
                    type: string
                    example: Forbidden
                  status:
                    type: integer
                    example: 403
                  detail:
                    type: string
                  instance:
                    type: string
                    nullable: true
              examples:
                passwordChangeRequired:
                  summary: Password change required
                  description: Returned when the user must change their temporary password before accessing protected features.
                  value:
                    type: https://errors.campuslynk.net/password-change-required
                    title: Password Change Required
                    status: 403
                    detail: You must change your password before accessing other features.
                forbidden:
                  summary: Wrong role or non-institution scope
                  description: Returned when the user lacks the super_admin role at institution scope.
                  value:
                    type: https://errors.campuslynk.net/forbidden
                    title: Forbidden
                    status: 403
                    detail: Access requires super_admin role at institution scope.
                impersonationNotAllowed:
                  summary: Impersonation session active
                  description: Returned when accessing setup endpoints during an impersonation session.
                  value:
                    type: https://errors.campuslynk.net/impersonation-not-allowed
                    title: Forbidden
                    status: 403
                    detail: Setup endpoints cannot be accessed during an impersonation session.
        '409':
          $ref: '#/components/responses/ProblemDetails'
          description: >-
            Setup was already finalized, including by a winning concurrent request.
            Returns the setup-already-completed problem type without changing policy
            values or existing completion timestamps.
        '422':
          $ref: '#/components/responses/ProblemDetails'
          description: >-
            Required profile/calendar settings or their completion timestamps, or a
            stream, department, or academic year, are missing. Returns the
            setup-prerequisites-missing problem type with errors.missing listing the
            unmet prerequisites. An unsaved signup_policy is not a missing prerequisite.
            No defaults or completion markers are persisted on failure.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  responses:
    ProblemDetails:
      description: >-
        RFC 7807 Problem Details error response. For 403 Forbidden on authenticated routes behind `EnsurePasswordNotMustChange`, returns problem type `password-change-required` when `must_change_password = true`, or `forbidden` when role/permission checks fail.
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, detail]
            properties:
              type:
                type: string
                description: URI reference identifying the problem type (non-dereferenceable identifier)
                example: about:blank
              title:
                type: string
                example: Unauthorized
              status:
                type: integer
                example: 401
              detail:
                type: string
                example: Invalid credentials provided.
              instance:
                type: string
                nullable: true

    SetupForbiddenProblemDetails:
      description: >-
        Forbidden response for setup wizard operations. Returned with one of three RFC 7807 problem types:
        - `password-change-required`: User has `must_change_password = true` and must change their password first.
        - `forbidden`: User lacks the `super_admin` role or is not assigned at institution scope.
        - `impersonation-not-allowed`: Setup endpoints cannot be accessed during an active impersonation session.
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, detail]
            properties:
              type:
                type: string
                description: URI reference identifying the problem type
                enum:
                  - https://errors.campuslynk.net/password-change-required
                  - https://errors.campuslynk.net/forbidden
                  - https://errors.campuslynk.net/impersonation-not-allowed
              title:
                type: string
                example: Forbidden
              status:
                type: integer
                example: 403
              detail:
                type: string
              instance:
                type: string
                nullable: true
          examples:
            passwordChangeRequired:
              summary: Password change required
              description: Returned when the user must change their temporary password before accessing protected features.
              value:
                type: https://errors.campuslynk.net/password-change-required
                title: Password Change Required
                status: 403
                detail: You must change your password before accessing other features.
            forbidden:
              summary: Wrong role or non-institution scope
              description: Returned when the user lacks the super_admin role at institution scope.
              value:
                type: https://errors.campuslynk.net/forbidden
                title: Forbidden
                status: 403
                detail: Access requires super_admin role at institution scope.
            impersonationNotAllowed:
              summary: Impersonation session active
              description: Returned when accessing setup endpoints during an impersonation session.
              value:
                type: https://errors.campuslynk.net/impersonation-not-allowed
                title: Forbidden
                status: 403
                detail: Setup endpoints cannot be accessed during an impersonation session.

  schemas:
    AuthCapabilitiesEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [staff_self_registration_enabled]
          properties:
            staff_self_registration_enabled:
              type: boolean
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true

    TenantSettingItem:
      type: object
      required: [value, is_default]
      properties:
        value:
          type: object
          additionalProperties: true
        is_default:
          type: boolean
        updated_at:
          type: string
          format: date-time
          nullable: true

    TenantSettingsEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [settings, token_summary]
          properties:
            settings:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/TenantSettingItem'
            token_summary:
              type: object
              required: [active_tokens_count, active_users_with_tokens_count]
              properties:
                active_tokens_count:
                  type: integer
                active_users_with_tokens_count:
                  type: integer
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true

    UpdateTenantSettingInput:
      type: object
      required: [value]
      properties:
        value:
          type: object
          additionalProperties: true
        reason:
          type: string
          maxLength: 500
          nullable: true

    UpdateTenantSettingEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [key, value, is_default]
          properties:
            key:
              type: string
            value:
              type: object
              additionalProperties: true
            is_default:
              type: boolean
            updated_at:
              type: string
              format: date-time
              nullable: true
        meta:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true

    AuditLogEntry:
      type: object
      required: [id, description, properties]
      properties:
        id:
          type: string
        log_name:
          type: string
          nullable: true
        event:
          type: string
          nullable: true
        description:
          type: string
        subject_type:
          type: string
          nullable: true
        subject_id:
          type: string
          nullable: true
        causer_id:
          type: string
          nullable: true
        causer_name:
          type: string
          nullable: true
        causer_email:
          type: string
          nullable: true
        properties:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
          nullable: true

    PaginatedAuditLogsEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogEntry'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        links:
          type: object
          additionalProperties: true

    Stream:
      type: object
