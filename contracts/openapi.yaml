openapi: 3.1.0
info:
  title: CampusLynk Academic Suite API
  version: 1.0.0
  description: >
    Multi-tenant SaaS & On-Premises Academic Management API (ADR-0001 through ADR-0012).
    All responses use the standard `{ data, meta, links }` envelope or `application/problem+json` (RFC 7807).
servers:
  - url: https://app.carmelpoly.in/api/v1
    description: Carmel Polytechnic On-Premises Instance
  - url: http://app.carmelpoly.localhost:8000/api/v1
    description: Local Development
paths:
  /health:
    get:
      operationId: getHealthStatus
      summary: Health check probe
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok

  /meta:
    get:
      operationId: getTenantMeta
      summary: Resolve tenant branding, active regulations (REV2021/REV2026), and auth providers
      parameters:
        - name: X-Tenant
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Tenant metadata resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMetaEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '404':
          $ref: '#/components/responses/ProblemDetails'

  /auth/login:
    post:
      operationId: login
      summary: Authenticate tenant user by email, mobile, or registration number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password, device_name, client]
              properties:
                identifier:
                  type: string
                  description: Email address, E.164 mobile number, or registration number
                  example: admin@app.carmelpoly.in
                password:
                  type: string
                  format: password
                  maxLength: 128
                  example: StrongPassword123!
                device_name:
                  type: string
                  example: Chrome Web
                client:
                  type: string
                  enum: [web, mobile]
                  example: web
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'
        '429':
          $ref: '#/components/responses/ProblemDetails'

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current personal access token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'

  /auth/password/change:
    post:
      operationId: changePassword
      summary: Change user password and revoke all other sessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, new_password_confirmation]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
                new_password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'

  /me:
    get:
      operationId: getCurrentUser
      summary: Current user profile, active scoped role assignments, capabilities, and tenant meta
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /notifications:
    get:
      operationId: listNotifications
      summary: List in-app notifications for the authenticated user (Web Notification Center + React Native)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated notifications

  /notifications/push-tokens:
    post:
      operationId: registerFcmPushToken
      summary: Register a Firebase Cloud Messaging (FCM) device token for web or React Native push notifications
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, fcm_token]
              properties:
                platform:
                  type: string
                  enum: [web, android, ios]
                fcm_token:
                  type: string
                device_name:
                  type: string
      responses:
        '200':
          description: Token registered

  /impersonation:
    post:
      operationId: startImpersonation
      summary: Start an audited impersonation session (max 30 mins; read-only for academic roles)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_user_id, reason]
              properties:
                target_user_id:
                  type: string
                reason:
                  type: string
                  minLength: 10
      responses:
        '200':
          description: Impersonation token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationTokenEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /impersonation/stop:
    post:
      operationId: stopImpersonation
      summary: Stop an active impersonation session and revoke token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Impersonation session ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'

  /users:
    get:
      operationId: listUsers
      summary: List users with pagination and filtering
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, suspended, pending]
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [staff, student, parent]
      responses:
        '200':
          description: Paginated users list
    post:
      operationId: createUser
      summary: Create a new user in the active tenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserInput'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '422':
          $ref: '#/components/responses/ProblemDetails'

  /users/{id}:
    get:
      operationId: getUser
      summary: Get user details and assigned roles
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'
        '404':
          $ref: '#/components/responses/ProblemDetails'
    put:
      operationId: updateUser
      summary: Update user attributes and status
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserInput'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEnvelope'

  /roles:
    get:
      operationId: listRoles
      summary: List assignable roles with singleton and stream metadata
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of roles

  /roles/assign:
    post:
      operationId: assignRole
      summary: Assign a scoped role to a user subject to delegation matrix and singleton constraints
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleInput'
      responses:
        '201':
          description: Role assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentEnvelope'
        '409':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'

  /roles/revoke:
    post:
      operationId: revokeRole
      summary: Revoke an active role assignment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_assignment_id]
              properties:
                role_assignment_id:
                  type: string
                reason:
                  type: string
      responses:
        '200':
          description: Role assignment revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'

  /departments:
    get:
      operationId: listDepartments
      summary: List institution departments with stream and academic/administrative kind
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of departments

  /batches:
    get:
      operationId: listBatches
      summary: List batches visible to current user based on ltree scope hierarchy
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated batches
    post:
      operationId: createBatch
      summary: Create a new academic batch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatchInput'
      responses:
        '201':
          description: Batch created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'

  /batches/{id}:
    get:
      operationId: getBatch
      summary: Get batch details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '404':
          $ref: '#/components/responses/ProblemDetails'

  /batches/{id}/promote:
    post:
      operationId: promoteBatchSemester
      summary: Promote batch to next semester and transition managing department per ADR-0005
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch promoted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  responses:
    ProblemDetails:
      description: RFC 7807 Problem Details error response
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, detail]
            properties:
              type:
                type: string
                example: about:blank
              title:
                type: string
                example: Unauthorized
              status:
                type: integer
                example: 401
              detail:
                type: string
                example: Invalid credentials provided.
              instance:
                type: string
                nullable: true

  schemas:
    TenantMetaEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [id, slug, name, academic_profile, regulations, auth_providers]
          properties:
            id:
              type: string
            slug:
              type: string
            name:
              type: string
            academic_profile:
              type: string
              enum: [polytechnic, engineering]
            regulations:
              type: array
              items:
                type: string
              example: ["REV2021", "REV2026"]
            auth_providers:
              type: object
              properties:
                password:
                  type: boolean
                passkey_webauthn:
                  type: boolean
                firebase_phone_otp:
                  type: boolean
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
            tenant:
              type: object
              properties:
                slug:
                  type: string
                name:
                  type: string
        links:
          type: object
          properties:
            self:
              type: string

    UserSchema:
      type: object
      required: [id, type, name, status, must_change_password]
      properties:
        id:
          type: string
          description: ULID identifier
          example: 01HZX876543210ABCDEFGHJKMN
        type:
          type: string
          enum: [staff, student, parent]
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          nullable: true
          example: john.doe@carmelpoly.in
        mobile:
          type: string
          nullable: true
          example: "+919876543210"
        registration_number:
          type: string
          nullable: true
          example: REG-2026-001
        status:
          type: string
          enum: [active, suspended, pending]
        must_change_password:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true

    LoginSuccessEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [token, token_type, expires_at, must_change_password, user]
          properties:
            token:
              type: string
              description: Plaintext personal access token (id|hash)
            token_type:
              type: string
              example: Bearer
            expires_at:
              type: string
              format: date-time
            must_change_password:
              type: boolean
            user:
              $ref: '#/components/schemas/UserSchema'
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
        links:
          type: object
          properties:
            self:
              type: string

    CurrentUserEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [id, type, name, status, must_change_password, assignments, capabilities]
          properties:
            id:
              type: string
            type:
              type: string
              enum: [staff, student, parent]
            name:
              type: string
            email:
              type: string
              nullable: true
            mobile:
              type: string
              nullable: true
            registration_number:
              type: string
              nullable: true
            status:
              type: string
              enum: [active, suspended, pending]
            must_change_password:
              type: boolean
            last_login_at:
              type: string
              format: date-time
              nullable: true
            assignments:
              type: array
              description: Placeholder for Step 4 Scoped RBAC
              items:
                type: object
            capabilities:
              type: array
              description: Placeholder for Step 4 Scoped RBAC
              items:
                type: string
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
        links:
          type: object
          properties:
            self:
              type: string

    MessageEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
        links:
          type: object
          properties:
            self:
              type: string

    ImpersonationTokenEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [token, expires_at, impersonator_id, target_user, is_read_only]
          properties:
            token:
              type: string
            expires_at:
              type: string
              format: date-time
            impersonator_id:
              type: string
            target_user:
              $ref: '#/components/schemas/UserSchema'
            is_read_only:
              type: boolean
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
        links:
          type: object
          properties:
            self:
              type: string

    CreateUserInput:
      type: object
      required: [type, name, password]
      properties:
        type:
          type: string
          enum: [staff, student, parent]
        name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        mobile:
          type: string
          nullable: true
        registration_number:
          type: string
          nullable: true
        password:
          type: string
          format: password
        must_change_password:
          type: boolean

    UpdateUserInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        mobile:
          type: string
          nullable: true
        registration_number:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, suspended, pending]
        must_change_password:
          type: boolean

    UserEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          $ref: '#/components/schemas/UserSchema'
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
        links:
          type: object
          properties:
            self:
              type: string

    AssignRoleInput:
      type: object
      required: [user_id, role_key, scope_type, scope_label]
      properties:
        user_id:
          type: string
        role_key:
          type: string
        scope_type:
          type: string
          enum: [institution, stream, department, managing_department, batch, own]
        scope_label:
          type: string
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true
        order_record:
          type: string
          nullable: true

    RoleAssignmentEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [id, user_id, role_id, role_key, scope_type, scope_label, is_singleton, is_active]
          properties:
            id:
              type: string
            user_id:
              type: string
            role_id:
              type: string
            role_key:
              type: string
            scope_type:
              type: string
            scope_label:
              type: string
            is_singleton:
              type: boolean
            is_active:
              type: boolean
            valid_from:
              type: string
              format: date-time
            valid_to:
              type: string
              format: date-time
              nullable: true
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
        links:
          type: object
          properties:
            self:
              type: string

    CreateBatchInput:
      type: object
      required: [program_id, home_department_id, academic_year_id, regulation_id, name]
      properties:
        program_id:
          type: string
        home_department_id:
          type: string
        academic_year_id:
          type: string
        regulation_id:
          type: string
        name:
          type: string
        entry_type:
          type: string
          enum: [regular, lateral]
        current_semester:
          type: integer
          minimum: 1
          maximum: 10

    BatchEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [id, name, program_id, home_department_id, managing_department_id, academic_year_id, regulation_id, entry_type, current_semester, status, scope_label, home_path, managing_path]
          properties:
            id:
              type: string
            name:
              type: string
            program_id:
              type: string
            home_department_id:
              type: string
            managing_department_id:
              type: string
            academic_year_id:
              type: string
            regulation_id:
              type: string
            entry_type:
              type: string
            current_semester:
              type: integer
            status:
              type: string
            scope_label:
              type: string
            home_path:
              type: string
            managing_path:
              type: string
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
        links:
          type: object
          properties:
            self:
              type: string
