openapi: 3.1.0
info:
  title: CampusLynk Academic Suite API
  version: 1.0.0
  description: >
    Multi-tenant SaaS & On-Premises Academic Management API (ADR-0001 through ADR-0012).
    All responses use the standard `{ data, meta, links }` envelope or `application/problem+json` (RFC 7807).
servers:
  - url: https://app.carmelpoly.in/api/v1
    description: Carmel Polytechnic On-Premises Instance
  - url: http://app.carmelpoly.localhost:8000/api/v1
    description: Local Development
paths:
  /health:
    get:
      operationId: getHealthStatus
      summary: Health check probe
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok

  /meta:
    get:
      operationId: getTenantMeta
      summary: Resolve tenant branding, active regulations (REV2021/REV2026), and auth providers
      parameters:
        - name: X-Tenant
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Tenant metadata resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMetaEnvelope'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '404':
          $ref: '#/components/responses/ProblemDetails'

  /auth/login:
    post:
      operationId: login
      summary: Authenticate tenant user by email, mobile, or registration number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password, device_name, client]
              properties:
                identifier:
                  type: string
                  description: Email address, E.164 mobile number, or registration number
                  example: admin@app.carmelpoly.in
                password:
                  type: string
                  format: password
                  maxLength: 128
                  example: StrongPassword123!
                device_name:
                  type: string
                  example: Chrome Web
                client:
                  type: string
                  enum: [web, mobile]
                  example: web
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'
        '429':
          $ref: '#/components/responses/ProblemDetails'

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current personal access token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'

  /auth/password/change:
    post:
      operationId: changePassword
      summary: Change user password and revoke all other sessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password, new_password_confirmation]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  maxLength: 128
                new_password_confirmation:
                  type: string
                  format: password
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '403':
          $ref: '#/components/responses/ProblemDetails'
        '422':
          $ref: '#/components/responses/ProblemDetails'

  /me:
    get:
      operationId: getCurrentUser
      summary: Current user profile, active scoped role assignments, capabilities, and tenant meta
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        '401':
          $ref: '#/components/responses/ProblemDetails'
        '403':
          $ref: '#/components/responses/ProblemDetails'

  /notifications:
    get:
      operationId: listNotifications
      summary: List in-app notifications for the authenticated user (Web Notification Center + React Native)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Paginated notifications

  /notifications/push-tokens:
    post:
      operationId: registerFcmPushToken
      summary: Register a Firebase Cloud Messaging (FCM) device token for web or React Native push notifications
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, fcm_token]
              properties:
                platform:
                  type: string
                  enum: [web, android, ios]
                fcm_token:
                  type: string
                device_name:
                  type: string
      responses:
        '200':
          description: Token registered

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  responses:
    ProblemDetails:
      description: RFC 7807 Problem Details error response
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, detail]
            properties:
              type:
                type: string
                example: about:blank
              title:
                type: string
                example: Unauthorized
              status:
                type: integer
                example: 401
              detail:
                type: string
                example: Invalid credentials provided.
              instance:
                type: string
                nullable: true

  schemas:
    TenantMetaEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [id, slug, name, academic_profile, regulations, auth_providers]
          properties:
            id:
              type: string
            slug:
              type: string
            name:
              type: string
            academic_profile:
              type: string
              enum: [polytechnic, engineering]
            regulations:
              type: array
              items:
                type: string
              example: ["REV2021", "REV2026"]
            auth_providers:
              type: object
              properties:
                password:
                  type: boolean
                passkey_webauthn:
                  type: boolean
                firebase_phone_otp:
                  type: boolean
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
            tenant:
              type: object
              properties:
                slug:
                  type: string
                name:
                  type: string
        links:
          type: object
          properties:
            self:
              type: string

    UserSchema:
      type: object
      required: [id, type, name, status, must_change_password]
      properties:
        id:
          type: string
          description: ULID identifier
          example: 01HZX876543210ABCDEFGHJKMN
        type:
          type: string
          enum: [staff, student, parent]
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          nullable: true
          example: john.doe@carmelpoly.in
        mobile:
          type: string
          nullable: true
          example: "+919876543210"
        registration_number:
          type: string
          nullable: true
          example: REG-2026-001
        status:
          type: string
          enum: [active, suspended, pending]
        must_change_password:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true

    LoginSuccessEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [token, token_type, expires_at, must_change_password, user]
          properties:
            token:
              type: string
              description: Plaintext personal access token (id|hash)
            token_type:
              type: string
              example: Bearer
            expires_at:
              type: string
              format: date-time
            must_change_password:
              type: boolean
            user:
              $ref: '#/components/schemas/UserSchema'
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
        links:
          type: object
          properties:
            self:
              type: string

    CurrentUserEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [id, type, name, status, must_change_password, assignments, capabilities]
          properties:
            id:
              type: string
            type:
              type: string
              enum: [staff, student, parent]
            name:
              type: string
            email:
              type: string
              nullable: true
            mobile:
              type: string
              nullable: true
            registration_number:
              type: string
              nullable: true
            status:
              type: string
              enum: [active, suspended, pending]
            must_change_password:
              type: boolean
            last_login_at:
              type: string
              format: date-time
              nullable: true
            assignments:
              type: array
              description: Placeholder for Step 4 Scoped RBAC
              items:
                type: object
            capabilities:
              type: array
              description: Placeholder for Step 4 Scoped RBAC
              items:
                type: string
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
        links:
          type: object
          properties:
            self:
              type: string

    MessageEnvelope:
      type: object
      required: [data, meta, links]
      properties:
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
        links:
          type: object
          properties:
            self:
              type: string
