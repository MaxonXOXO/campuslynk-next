# -----------------------------------------------------------------------------
# Academic Suite - Cloud Deployment Profile (Sprint 0 Compose Topology)
# -----------------------------------------------------------------------------
# In production AWS environments (Stage 1), postgres and redis may be swapped
# for managed Amazon RDS PostgreSQL 17 and Amazon ElastiCache Redis, while the
# container services (api, web) remain identical.
# -----------------------------------------------------------------------------

services:
  postgres:
    image: postgres:17-alpine
    container_name: academic_cloud_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: landlord
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-academic_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-supersecret}
    volumes:
      - postgres_cloud_data:/var/lib/postgresql/data
      - ../../docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-academic_admin} -d landlord" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0@sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
    container_name: academic_cloud_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: pgbouncer_auth
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 30
      MAX_PREPARED_STATEMENTS: 100
      AUTH_TYPE: scram-sha-256
      AUTH_USER: pgbouncer_auth
      AUTH_QUERY: "SELECT usename, passwd FROM user_search($1)"
      AUTH_DBNAME: landlord
      SERVER_LOGIN_RETRY: 0
      ADMIN_USERS: pgbouncer_auth
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U pgbouncer_auth" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: academic_cloud_redis
    restart: unless-stopped
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ../../../backend
      dockerfile: ../deploy/docker/Dockerfile.api
    container_name: academic_cloud_api
    restart: unless-stopped
    environment:
      DEPLOY_PROFILE: cloud
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:c29tZXJhbmRvbXN0cmluZ2ZvcmFwcGtleXNlY3VyZTEyMw==}
      APP_URL: ${API_URL:-http://localhost:8000}
      DB_CONNECTION: unconfigured
      LANDLORD_DB_HOST: pgbouncer
      LANDLORD_DB_PORT: 6432
      LANDLORD_DB_DATABASE: landlord
      LANDLORD_DB_USERNAME: ${LANDLORD_DB_USER:-landlord_app}
      LANDLORD_DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/up" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ops:
    build:
      context: ../../../backend
      dockerfile: ../deploy/docker/Dockerfile.api
    container_name: academic_cloud_ops
    profiles: [ "ops" ]
    restart: "no"
    environment:
      DEPLOY_PROFILE: cloud
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:c29tZXJhbmRvbXN0cmluZ2ZvcmFwcGtleXNlY3VyZTEyMw==}
      APP_URL: ${API_URL:-http://localhost:8000}
      DB_CONNECTION: unconfigured
      LANDLORD_DB_HOST: pgbouncer
      LANDLORD_DB_PORT: 6432
      LANDLORD_DB_DATABASE: landlord
      LANDLORD_DB_USERNAME: ${ADMIN_DB_USER:-provisioner}
      LANDLORD_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-secret}
      ADMIN_DB_HOST: postgres
      ADMIN_DB_PORT: 5432
      ADMIN_DB_DATABASE: landlord
      ADMIN_DB_USERNAME: ${ADMIN_DB_USER:-provisioner}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../../../frontend
      dockerfile: ../deploy/docker/Dockerfile.web
    container_name: academic_cloud_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_cloud_data:
    name: academic_cloud_postgres_data
