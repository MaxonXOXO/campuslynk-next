services:
  postgres:
    image: postgres:17-alpine
    container_name: academic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: landlord
      POSTGRES_USER: ${DB_USERNAME:-academic_suite}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-academic_suite} -d landlord"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.0-p0@sha256:b17551c776ef7e5769ef80b956d20f85e2fd25dd8912d31d58f782aad495b711
    container_name: academic_pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USERNAME:-academic_suite}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      MAX_PREPARED_STATEMENTS: 100
      AUTH_TYPE: scram-sha-256
      AUTH_USER: ${DB_USERNAME:-academic_suite}
      AUTH_QUERY: "SELECT usename, passwd FROM pg_shadow WHERE usename=$1"
      AUTH_DBNAME: landlord
      SERVER_LOGIN_RETRY: 0
      ADMIN_USERS: ${DB_USERNAME:-academic_suite}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${DB_USERNAME:-academic_suite}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: academic_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ../../../backend
      dockerfile: ../deploy/docker/Dockerfile.api
    container_name: academic_api
    restart: unless-stopped
    environment:
      DEPLOY_PROFILE: onprem
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:c29tZXJhbmRvbXN0cmluZ2ZvcmFwcGtleXNlY3VyZTEyMw==}
      APP_URL: ${API_URL:-http://localhost:8000}
      DB_CONNECTION: unconfigured
      LANDLORD_DB_HOST: pgbouncer
      LANDLORD_DB_PORT: 6432
      LANDLORD_DB_DATABASE: landlord
      LANDLORD_DB_USERNAME: ${DB_USERNAME:-academic_suite}
      LANDLORD_DB_PASSWORD: ${DB_PASSWORD:-secret}
      ADMIN_DB_HOST: postgres
      ADMIN_DB_PORT: 5432
      ADMIN_DB_DATABASE: landlord
      ADMIN_DB_USERNAME: ${DB_USERNAME:-academic_suite}
      ADMIN_DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ../../../frontend
      dockerfile: ../deploy/docker/Dockerfile.web
    container_name: academic_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
    name: academic_postgres_data

